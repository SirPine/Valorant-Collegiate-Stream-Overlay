<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Score Control</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111318;
    color: #fff;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
    gap: 10px;
    height: 100vh;
    box-sizing: border-box;
  }
  h2 { margin: 0; font-size: 15px; color: #9fb4ff; text-align: center; }

  .labels-row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .team-label-input {
    background: #1c1f26;
    border: 1px solid #333;
    color: #fff;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    width: 130px;
    text-align: center;
  }

  /* searchable team dropdown: logo + text box, list of teams from assets/teams below it */
  .team-picker { position: relative; display: flex; align-items: center; gap: 6px; }
  .team-picker-logo { width: 24px; height: 24px; object-fit: contain; }
  .team-options {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    max-height: 220px;
    overflow-y: auto;
    background: #1c1f26;
    border: 1px solid #333;
    border-radius: 6px;
    z-index: 100;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
  }
  .team-options.open { display: block; }
  .team-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .team-option img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
  .team-option.highlighted { background: #22304f; }
  .team-option.selected { color: #9fb4ff; }
  .team-options .no-match { padding: 6px 8px; font-size: 12px; color: #666; }

  .bestof-row { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .bestof-label { color: #aaa; font-size: 12px; }
  .bestof-btn {
    width: 32px;
    height: 28px;
    font-size: 13px;
    background: #1c1f26;
    border: 2px solid #333;
    color: #ccc;
    padding: 0;
  }
  .bestof-btn.active {
    border-color: #2b6fff;
    background: #22304f;
    color: #fff;
  }

  .row { display: flex; gap: 16px; justify-content: center; }
  .side {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1c1f26;
    border-radius: 8px;
    padding: 8px 14px;
    flex: 1;
    max-width: 160px;
  }
  .side h3 { margin: 0 0 4px; font-size: 11px; color: #aaa; font-weight: normal; text-align: center; }
  .score-num { font-size: 32px; font-weight: 900; margin: 2px 0; min-width: 40px; text-align: center; line-height: 1; }
  .btns { display: flex; gap: 8px; }
  button {
    background: #2b6fff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    width: 34px;
    height: 30px;
    cursor: pointer;
  }
  button.minus { background: #444a58; }
  button:active { transform: scale(0.95); }
  .reset {
    background: #7a1f1f;
    width: auto;
    height: auto;
    padding: 6px 14px;
    font-size: 12px;
    align-self: center;
  }

  .section-title { margin: 2px 0 0; font-size: 11px; color: #9fb4ff; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
  .roster {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .roster-map { font-size: 12px; color: #9fb4ff; text-align: center; }
  .roster-teams { display: flex; gap: 8px; }
  .roster-team { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .roster-team-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    padding: 2px 4px;
  }
  .roster-team-header img { width: 20px; height: 20px; object-fit: contain; }
  .roster-team-header .side-tag { margin-left: auto; color: #666; font-size: 10px; font-weight: normal; }
  .roster-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1c1f26;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 12px;
    min-height: 24px;
  }
  .roster-row img { width: 24px; height: 24px; border-radius: 4px; flex-shrink: 0; }
  .roster-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster-row.waiting { color: #555; font-style: italic; }
  .switch-btn {
    background: #22304f;
    border: 2px solid #2b6fff;
    width: auto;
    height: auto;
    padding: 6px 14px;
    font-size: 12px;
    align-self: center;
  }
  .empty-note { color: #666; font-size: 12px; text-align: center; padding: 4px 0; }

  .bottom-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .shutdown-btn {
    background: #3a0f0f;
    border: 1px solid #7a1f1f;
    width: auto;
    height: auto;
    padding: 6px 12px;
    font-size: 11px;
    color: #ccc;
  }
  .hint { font-size: 10px; color: #666; text-align: center; line-height: 1.4; }
  kbd {
    background: #333; padding: 1px 5px; border-radius: 4px; font-size: 10px;
  }

  /* ---------- layout ---------- */

  /* everything between the title and the bottom row; scrolls when the dock is short */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  /* ---------- intro scene (timer, maps) ---------- */

  .timer-row { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .timer-row input[type="datetime-local"] {
    background: #1c1f26;
    border: 1px solid #333;
    color: #fff;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
  }
  .set-timer-btn {
    background: #2b6fff;
    width: auto;
    height: auto;
    padding: 7px 14px;
    font-size: 12px;
  }
  .clear-timer-btn {
    background: #444a58;
    width: auto;
    height: auto;
    padding: 7px 10px;
    font-size: 12px;
  }
  .map-picker-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .map-picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .map-picker label { font-size: 10px; color: #888; }
  .map-picker select {
    background: #1c1f26;
    border: 1px solid #333;
    color: #fff;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    width: 140px;
  }
  /* picked map is in the current competitive pool */
  .map-picker select.in-pool {
    border-color: #2b6fff;
    background: #22304f;
  }
  /* picked map is out of rotation */
  .map-picker select.off-pool { color: #999; }
  .map-picker optgroup { color: #9fb4ff; font-style: normal; }
  .map-picker option { background: #1c1f26; color: #fff; }
  .map-picker option.off-pool { color: #888; }
  /* already in another map slot - picking it moves it here */
  .map-picker option.taken { color: #4a4a4a; background: #111318; }
  .map-pool-note { color: #888; font-size: 11px; text-align: center; line-height: 1.5; }
  .map-pool-note b { color: #9fb4ff; font-weight: normal; }
</style>
</head>
<body>

  <h2>Stream Control</h2>

  <div class="panel">
    <div class="labels-row">
      <div class="team-picker">
        <img class="team-picker-logo" id="teamLabelLogo" alt="" />
        <input class="team-label-input" id="teamLabel" placeholder="Our team" autocomplete="off" />
        <div class="team-options" id="teamLabelOptions"></div>
      </div>
      <div class="team-picker">
        <img class="team-picker-logo" id="opponentLabelLogo" alt="" />
        <input class="team-label-input" id="opponentLabel" placeholder="Opponent" autocomplete="off" />
        <div class="team-options" id="opponentLabelOptions"></div>
      </div>
    </div>

    <div class="bestof-row">
      <span class="bestof-label">Best of:</span>
      <button class="bestof-btn" data-bo="1" onclick="setBestOf(1)">1</button>
      <button class="bestof-btn" data-bo="3" onclick="setBestOf(3)">3</button>
      <button class="bestof-btn" data-bo="5" onclick="setBestOf(5)">5</button>
    </div>

    <div class="row">
      <div class="side">
        <h3>US MAPS WON</h3>
        <div class="score-num" id="usVal">0</div>
        <div class="btns">
          <button class="minus" onclick="adjust('us', -1)">−</button>
          <button onclick="adjust('us', 1)">+</button>
        </div>
      </div>
      <div class="side">
        <h3>THEM MAPS WON</h3>
        <div class="score-num" id="themVal">0</div>
        <div class="btns">
          <button class="minus" onclick="adjust('them', -1)">−</button>
          <button onclick="adjust('them', 1)">+</button>
        </div>
      </div>
    </div>

    <button class="reset" onclick="resetScore()">Reset Score</button>

    <div class="section-title">Countdown Timer</div>
    <div class="timer-row">
      <input type="datetime-local" id="timerInput" />
      <button class="set-timer-btn" onclick="setTimer()">Set</button>
      <button class="clear-timer-btn" onclick="clearTimer()">Clear</button>
    </div>

    <div class="section-title">Maps</div>
    <div class="map-picker-row" id="mapPickerRow"></div>
    <div class="map-pool-note" id="mapPoolNote"></div>

    <div class="section-title">Live Roster</div>
    <button class="switch-btn" onclick="switchTeams()"
      title="Swap which in-game team shows on the left (your team) and the right (opponent)">&#8644; Switch Teams</button>
    <div class="roster" id="roster">
      <div class="empty-note">Not in a match</div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="hint">
      <kbd>↑</kbd>/<kbd>↓</kbd> US &nbsp; <kbd>→</kbd>/<kbd>←</kbd> THEM
    </div>
    <button class="shutdown-btn" onclick="shutdownServer()">Shut Down Server</button>
  </div>

<script>
  let current = { teamLabel: 'UB', opponentLabel: 'OPP', us: 0, them: 0, bestOf: 3 };

  function render() {
    document.getElementById('usVal').textContent = current.us;
    document.getElementById('themVal').textContent = current.them;
    document.getElementById('teamLabel').value = current.teamLabel;
    document.getElementById('opponentLabel').value = current.opponentLabel;
    showTeamLogo('teamLabelLogo', current.teamLabel);
    showTeamLogo('opponentLabelLogo', current.opponentLabel);
    document.querySelectorAll('.bestof-btn[data-bo]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.bo) === (current.bestOf || 3));
    });
    renderRoster(latestRoster); // team names/logos in the roster follow the labels above
    renderMapPickers(); // number of map pickers follows Best of
  }

  async function push(partial) {
    const res = await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(partial),
    });
    current = await res.json();
    render();
  }

  function adjust(side, delta) {
    const next = Math.max(0, (current[side] || 0) + delta);
    push({ [side]: next });
  }

  function resetScore() {
    push({ us: 0, them: 0 });
  }

  function setBestOf(n) {
    push({ bestOf: n });
  }

  // ---------- searchable team dropdowns ----------
  // Click a box to see every team in assets/teams (with logos), type to narrow the list, pick with
  // click or arrow keys + Enter. A name that isn't in the list can still be typed in - it just has
  // no logo.

  let teamNames = [];

  function showTeamLogo(imgId, name) {
    const img = document.getElementById(imgId);
    img.onerror = () => { img.style.visibility = 'hidden'; };
    img.onload = () => { img.style.visibility = 'visible'; };
    if (name) img.src = '/team-logo/' + encodeURIComponent(name);
    else img.style.visibility = 'hidden';
  }

  function setUpTeamPicker(field) {
    const input = document.getElementById(field);
    const list = document.getElementById(field + 'Options');
    let shown = [];
    let highlighted = -1;

    function save(name) {
      list.classList.remove('open');
      input.value = name;
      if (name !== current[field]) push({ [field]: name });
    }

    function renderList(filter) {
      const q = filter.trim().toLowerCase();
      shown = teamNames.filter((t) => t.toLowerCase().includes(q));
      highlighted = shown.length ? 0 : -1;
      list.innerHTML = '';
      if (!shown.length) {
        list.innerHTML = '<div class="no-match">No team logo with that name - press Enter to use it anyway</div>';
      }
      shown.forEach((name, i) => {
        const row = document.createElement('div');
        row.className = 'team-option' + (name === current[field] ? ' selected' : '');
        const logo = document.createElement('img');
        logo.src = '/team-logo/' + encodeURIComponent(name);
        const label = document.createElement('span');
        label.textContent = name;
        row.append(logo, label);
        // mousedown (not click) so it fires before the box loses focus
        row.addEventListener('mousedown', (e) => {
          e.preventDefault();
          save(name);
          input.blur();
        });
        row.addEventListener('mouseenter', () => setHighlight(i));
        list.appendChild(row);
      });
      setHighlight(highlighted);
      list.classList.add('open');
    }

    function setHighlight(i) {
      highlighted = i;
      [...list.querySelectorAll('.team-option')].forEach((row, j) => row.classList.toggle('highlighted', j === i));
      const row = list.querySelectorAll('.team-option')[i];
      if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('focus', () => {
      input.select();
      renderList(''); // whole list on open; typing narrows it
    });
    input.addEventListener('input', () => renderList(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!shown.length) return;
        const step = e.key === 'ArrowDown' ? 1 : -1;
        setHighlight((highlighted + step + shown.length) % shown.length);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        save(highlighted >= 0 ? shown[highlighted] : input.value.trim());
        input.blur();
      } else if (e.key === 'Escape') {
        input.value = current[field]; // cancel
        list.classList.remove('open');
        input.blur();
      }
    });
    input.addEventListener('blur', () => {
      if (!list.classList.contains('open')) return; // already picked or cancelled
      list.classList.remove('open');
      const typed = input.value.trim();
      // clicked away after typing: use an exact (any case) team match, else the typed text
      const match = teamNames.find((t) => t.toLowerCase() === typed.toLowerCase());
      save(match || typed || current[field]);
    });
  }

  setUpTeamPicker('teamLabel');
  setUpTeamPicker('opponentLabel');
  fetch('/api/team-logos').then((r) => r.json()).then((names) => { teamNames = names; });

  fetch('/api/score').then(r => r.json()).then(s => { current = s; render(); });

  // ---------- live roster (read-only - comes straight from the Valorant client) ----------
  // Left = your team ("Our team" above), right = the opponent - the same sides as the overlay.

  let latestRoster = { map: '', left: [], right: [] };

  function teamColumn(teamName, side, players) {
    const col = document.createElement('div');
    col.className = 'roster-team';

    const header = document.createElement('div');
    header.className = 'roster-team-header';
    const logo = document.createElement('img');
    logo.onerror = () => { logo.style.visibility = 'hidden'; };
    if (teamName) logo.src = '/team-logo/' + encodeURIComponent(teamName);
    else logo.style.visibility = 'hidden';
    const name = document.createElement('span');
    name.textContent = teamName || '(no name)';
    const sideLabel = document.createElement('span');
    sideLabel.className = 'side-tag';
    sideLabel.textContent = side;
    header.append(logo, name, sideLabel);
    col.appendChild(header);

    if (!players.length) {
      // Riot hides the other team during agent select
      const row = document.createElement('div');
      row.className = 'roster-row waiting';
      row.textContent = 'Waiting for match to load...';
      col.appendChild(row);
    }
    players.forEach((p) => {
      const row = document.createElement('div');
      row.className = 'roster-row';
      row.title = p.agent ? `${p.player} - ${p.agent}` : `${p.player} - picking...`;
      const icon = document.createElement('img');
      if (p.agent) icon.src = '/agent-icon/' + encodeURIComponent(p.agent);
      else icon.style.visibility = 'hidden';
      const label = document.createElement('span');
      label.className = 'name';
      label.textContent = p.player;
      row.append(icon, label);
      col.appendChild(row);
    });
    return col;
  }

  function renderRoster(roster) {
    latestRoster = roster;
    const container = document.getElementById('roster');
    container.innerHTML = '';
    if (!roster.left.length && !roster.right.length) {
      container.innerHTML = '<div class="empty-note">Not in a match</div>';
      return;
    }
    if (roster.map) {
      const map = document.createElement('div');
      map.className = 'roster-map';
      map.textContent = roster.map;
      container.appendChild(map);
    }
    const teams = document.createElement('div');
    teams.className = 'roster-teams';
    teams.append(
      teamColumn(current.teamLabel, 'LEFT', roster.left),
      teamColumn(current.opponentLabel, 'RIGHT', roster.right)
    );
    container.appendChild(teams);
  }

  function switchTeams() {
    // the new roster arrives through the 'roster' event below, same as for the overlay
    fetch('/api/switch-teams', { method: 'POST' });
  }

  const teamEvents = new EventSource('/events');
  teamEvents.addEventListener('roster', (e) => renderRoster(JSON.parse(e.data)));

  function shutdownServer() {
    if (!confirm('Shut down the overlay server? The overlay in OBS will stop updating until you restart it.')) return;
    fetch('/api/shutdown', { method: 'POST' }).finally(() => {
      document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#888;font-family:Arial,sans-serif;">Server stopped. Run start.bat (or npm run dev) to restart it.</div>';
    });
  }

  window.addEventListener('keydown', (e) => {
    if (document.activeElement && (document.activeElement.id === 'teamLabel' || document.activeElement.id === 'opponentLabel')) return;
    if (e.key === 'ArrowUp') adjust('us', 1);
    if (e.key === 'ArrowDown') adjust('us', -1);
    if (e.key === 'ArrowRight') adjust('them', 1);
    if (e.key === 'ArrowLeft') adjust('them', -1);
  });

  // ---------- intro scene: countdown timer + maps ----------

  let currentIntro = { targetTime: null, maps: ['', '', '', '', ''] };
  let availableMaps = [];

  function localDatetimeInputValue(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function pushIntro(partial) {
    const res = await fetch('/api/intro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(partial),
    });
    currentIntro = await res.json();
    renderIntroTab();
  }

  function setTimer() {
    const val = document.getElementById('timerInput').value;
    if (!val) return;
    pushIntro({ targetTime: new Date(val).toISOString() });
  }

  function clearTimer() {
    document.getElementById('timerInput').value = '';
    pushIntro({ targetTime: null });
  }

  function setMap(index, value) {
    const maps = [...(currentIntro.maps || [])];
    while (maps.length < 5) maps.push('');
    // a map can only be in one slot: picking one that's already used moves it here
    const count = current.bestOf || 3;
    for (let j = 0; j < count; j++) {
      if (j !== index && value && maps[j] === value) maps[j] = '';
    }
    maps[index] = value;
    pushIntro({ maps });
  }

  // current competitive rotation (Riot only reports it while Valorant is open; the server keeps
  // the last one it saw and pushes an update when it changes)
  let mapPool = { maps: [], updatedAt: null };

  // takenBy: number of the other slot this map is already in (picking it moves it here), or 0
  function mapOption(name, { inPool, takenBy }) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = takenBy ? `${name} (map ${takenBy})` : name;
    if (!inPool) opt.className = 'off-pool';
    if (takenBy) opt.className = 'taken';
    return opt;
  }

  function renderMapPickers() {
    const row = document.getElementById('mapPickerRow');
    const count = current.bestOf || 3; // one picker per map: Bo1 = 1, Bo3 = 3, Bo5 = 5
    const picks = (currentIntro.maps || []).slice(0, count);
    const inPool = new Set(mapPool.maps);
    const poolMaps = availableMaps.filter((m) => inPool.has(m));
    const otherMaps = availableMaps.filter((m) => !inPool.has(m));

    row.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'map-picker';
      const label = document.createElement('label');
      label.textContent = count === 1 ? 'Map' : ('Map ' + (i + 1));
      const select = document.createElement('select');
      const blankOpt = document.createElement('option');
      blankOpt.value = '';
      blankOpt.textContent = '-- choose --';
      select.appendChild(blankOpt);

      // maps picked in the other slots
      const takenBy = {}; // map -> number of the other slot it's in
      picks.forEach((m, j) => { if (m && j !== i) takenBy[m] = j + 1; });
      const add = (parent, m) => parent.appendChild(mapOption(m, { inPool: inPool.has(m) || !poolMaps.length, takenBy: takenBy[m] || 0 }));
      if (poolMaps.length) {
        // current pool first, the rest after
        const poolGroup = document.createElement('optgroup');
        poolGroup.label = 'Current map pool';
        poolMaps.forEach((m) => add(poolGroup, m));
        const otherGroup = document.createElement('optgroup');
        otherGroup.label = 'Other maps';
        otherMaps.forEach((m) => add(otherGroup, m));
        select.append(poolGroup, otherGroup);
      } else {
        availableMaps.forEach((m) => add(select, m)); // pool not known yet - plain list
      }

      select.value = picks[i] || '';
      if (picks[i] && poolMaps.length) select.className = inPool.has(picks[i]) ? 'in-pool' : 'off-pool';
      select.onchange = () => setMap(i, select.value);
      wrap.appendChild(label);
      wrap.appendChild(select);
      row.appendChild(wrap);
    }
    renderMapPoolNote();
  }

  function renderMapPoolNote() {
    const note = document.getElementById('mapPoolNote');
    if (!mapPool.maps.length) {
      note.textContent = "Current map pool not known yet - it's picked up automatically while Valorant is open.";
      return;
    }
    const when = mapPool.updatedAt
      ? new Date(mapPool.updatedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : '';
    note.innerHTML = '';
    const label = document.createElement('b');
    label.textContent = 'Current map pool: ';
    note.append(label, mapPool.maps.join(', '), when ? ` (checked ${when})` : '');
  }

  function renderIntroTab() {
    document.getElementById('timerInput').value = localDatetimeInputValue(currentIntro.targetTime);
    renderMapPickers();
  }

  fetch('/api/maps').then(r => r.json()).then(maps => { availableMaps = maps; renderMapPickers(); });
  fetch('/api/intro').then(r => r.json()).then(intro => { currentIntro = intro; renderIntroTab(); });

  const introEvents = new EventSource('/events');
  introEvents.addEventListener('mapPool', (e) => {
    mapPool = JSON.parse(e.data);
    renderMapPickers();
  });
  introEvents.addEventListener('intro', (e) => {
    currentIntro = JSON.parse(e.data);
    renderIntroTab();
  });
</script>

</body>
</html>
