<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Intro Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* everything is laid out on this 1920x1080 canvas; scale.js fits it to the window */
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
  }

  #bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    z-index: 0;
  }

  .box {
    position: absolute;
    box-sizing: border-box;
  }

  /* ---------- timer ---------- */

  #timer-box {
    left: 20px;
    top: 20px;
    width: 498px;
    height: 146px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #timer-text {
    color: #ffffff;
    font-weight: 900;
    font-size: 64px;
    letter-spacing: 2px;
  }

  /* ---------- team logos ---------- */

  .logo-box {
    top: 287px;
    width: 397px;
    height: 397px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #logo-left { left: 282px; }
  #logo-right { left: 1240px; }

  .logo-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
  }

  .team-name {
    position: absolute;
    left: -8px;
    right: -8px;
    top: 100%;
    margin-top: 10px;
    color: #ffffff;
    font-weight: 900;
    font-size: 30px;
    text-align: center;
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 2px 6px rgba(0,0,0,0.6);
  }

  /* ---------- map slots ---------- */
  /* One box per map (Bo1 = 1, Bo3 = 3, Bo5 = 5), drawn here rather than in the background
     image, in a row centered on the screen. Bo1/Bo3 line up with where the boxes used to be
     in intro-background.png. */

  #map-row {
    position: absolute;
    left: 0;
    right: 0;
    top: 780px;
    display: flex;
    justify-content: center;
    gap: 113px;
  }

  #map-row.bo5 {
    gap: 60px; /* keeps all 5 clear of the screen edges */
  }

  .map-box {
    position: relative;
    width: 215px;
    height: 215px;
    background: #424242; /* same grey as the old boxes, shown until a map is picked */
    overflow: hidden;
  }

  .map-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .map-name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 6px 4px;
    background: rgba(0, 0, 0, 0.65);
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    text-align: center;
    box-sizing: border-box;
  }

</style>
</head>
<body>
<div id="stage">

  <img id="bg" src="/intro-background.png" alt="" />

  <div class="box" id="timer-box">
    <span id="timer-text">00:00:00</span>
  </div>

  <div class="box logo-box" id="logo-left">
    <img id="logo-left-img" src="" alt="" />
    <div class="team-name" id="name-left"></div>
  </div>

  <div class="box logo-box" id="logo-right">
    <img id="logo-right-img" src="" alt="" />
    <div class="team-name" id="name-right"></div>
  </div>

  <div id="map-row"></div>

</div>
<script src="/scale.js"></script>

<script>
  let targetTime = null;

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function renderTimer() {
    const el = document.getElementById('timer-text');
    if (!targetTime) {
      el.textContent = '00:00:00';
      return;
    }
    const diffMs = new Date(targetTime).getTime() - Date.now();
    if (diffMs <= 0) {
      el.textContent = '00:00:00';
      return;
    }
    const totalSeconds = Math.floor(diffMs / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    el.textContent = days > 0
      ? `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`
      : `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  setInterval(renderTimer, 1000);

  function loadTeamLogo(imgId, nameId, name) {
    const img = document.getElementById(imgId);
    const nameEl = document.getElementById(nameId);
    nameEl.textContent = name || '';
    if (!name) {
      img.style.display = 'none';
      return;
    }
    const url = '/team-logo/' + encodeURIComponent(name) + '?t=' + Date.now();
    img.onerror = () => {
      img.style.display = 'none';
      console.error('[intro overlay] team logo not found:', name, '- tried', url, '- check assets/teams/ for a matching file (any case, .png/.jpg/.jpeg/.webp)');
    };
    img.onload = () => { img.style.display = 'block'; };
    img.src = url;
  }

  // the map slots depend on both the map picks (intro settings) and Best of (score settings)
  let latestMaps = [];
  let latestBestOf = 3;

  function renderIntro(intro) {
    targetTime = intro.targetTime;
    renderTimer();
    latestMaps = intro.maps || [];
    renderMaps();
  }

  // one map box: image (if a map is picked) + name bar
  function mapBox(mapName) {
    const box = document.createElement('div');
    box.className = 'map-box';
    if (!mapName) return box;

    const img = document.createElement('img');
    const url = '/map-image/' + encodeURIComponent(mapName) + '?t=' + Date.now();
    img.onerror = () => {
      img.style.display = 'none';
      console.error('[intro overlay] map image not found:', mapName, '- tried', url, '- not on valorant-api.com and no matching file in assets/maps/');
    };
    img.onload = () => { img.style.display = 'block'; };
    img.src = url;

    const name = document.createElement('div');
    name.className = 'map-name';
    name.textContent = mapName;

    box.append(img, name);
    return box;
  }

  function renderMaps() {
    const row = document.getElementById('map-row');
    const count = [1, 3, 5].includes(latestBestOf) ? latestBestOf : 3;
    row.className = 'bo' + count;
    row.innerHTML = '';
    for (let i = 0; i < count; i++) row.appendChild(mapBox(latestMaps[i]));
  }

  function renderScore(score) {
    loadTeamLogo('logo-left-img', 'name-left', score.teamLabel);
    loadTeamLogo('logo-right-img', 'name-right', score.opponentLabel);
    if ((score.bestOf || 3) !== latestBestOf) {
      latestBestOf = score.bestOf || 3;
      renderMaps();
    }
  }

  // initial load
  fetch('/api/intro').then(r => r.json()).then(renderIntro).catch(() => {});
  fetch('/api/score').then(r => r.json()).then(renderScore).catch(() => {});

  // live updates
  const es = new EventSource('/events');
  es.addEventListener('intro', (e) => renderIntro(JSON.parse(e.data)));
  es.addEventListener('score', (e) => renderScore(JSON.parse(e.data)));
</script>

</body>
</html>
